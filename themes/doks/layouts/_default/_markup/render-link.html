{{- $u := urls.Parse .Destination -}}
<a href="{{ .Destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- if $u.IsAbs }} target="_blank" {{ end -}}
  onClick="return sendNavMessage('{{ .Destination | safeURL }}', '{{ .Destination | absURL }}', event)"
>
  {{- with .Text | safeHTML }}{{ . }}{{ end -}}

</a>
