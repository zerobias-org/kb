canonifyURLs = false
disableAliases = true
disableHugoGeneratorInject = true
enableEmoji = true
enableRobotsTXT = true
[pagination]
  pagerSize = 7
rssLimit = 10

# Multilingual
defaultContentLanguage = "en"
disableLanguages = ["de", "nl"]
# defaultContentLanguageInSubdir = true

# The REDIRECTS and HEADERS output formats are gone, along with the text/netlify
# mediaType that existed only to serve them and the two templates that rendered them.
# They emitted Netlify's _redirects and _headers into every article bundle, and these
# articles are served from S3 behind CloudFront, which ignores both files entirely.
#
# _headers was not merely inert, it was wrong: it declared X-Frame-Options SAMEORIGIN
# and a CSP whose frame-ancestors allowed jamstackthemes.dev, which is Doks' own demo
# host. Had anything honoured it, it would have blocked the platform iframe these
# articles are designed to render inside.
#
# _redirects mapped Hugo aliases to Netlify redirect rules and carried Doks' demo
# examples as comments.
[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS", "SITEMAP"]

# add output format for section sitemap.xml
[outputFormats.SITEMAP]
mediaType = "application/xml"
baseName = "sitemap"
isHTML = false
isPlainText = true
noUgly = true
rel  = "sitemap"

[caches]
  [caches.getresource]
    dir = ":cacheDir/:project"
    maxAge = "10s"

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]
  contributor = "contributors"
  category = "categories"
  tag = "tags"

[permalinks]
  blog = "/blog/:title/"
# docs = "/docs/1.0/:sections[1:]/:title/"

[minify.tdewolff.html]
  keepWhitespace = false

[related]
  threshold = 80
  includeNewer = true
  toLower = false
    [[related.indices]]
    name = "categories"
    weight = 100
    [[related.indices]]
    name = "tags"
    weight = 80
    [[related.indices]]
    name = "date"
    weight = 10

[module]
  [module.hugoVersion]
    extended = true
    min = "0.80.0"
    max = ""
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "node_modules/flexsearch"
    target = "assets/js/vendor/flexsearch"
  [[module.mounts]]
    source = "node_modules/katex"
    target = "assets/js/vendor/katex"
  [[module.mounts]]
    source = "node_modules/mermaid"
    target = "assets/js/vendor/mermaid"
  [[module.mounts]]
    source = "node_modules/@hyas/images/layouts"
    target = "layouts"
